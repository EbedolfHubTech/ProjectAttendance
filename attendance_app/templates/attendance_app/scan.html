<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Student QR Code</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-dark text-white">

    <!-- Top Navigation Bar -->
    <div style="padding: 10px 20px; background-color: #212529; border-bottom: 1px solid #444;" class="d-flex justify-content-between align-items-center">
        <h3 class="m-0 text-white fs-5">📷 QR Attendance Scanner</h3>
        <div>
            <a href="/" class="btn btn-primary btn-sm fw-bold me-1">
                📊 View Dashboard
            </a>
            <a href="/admin/" class="btn btn-success btn-sm fw-bold">
                ⚙️ Admin Panel
            </a>
        </div>
    </div>

    <div class="container text-center mt-4">
        <h2 class="mb-3">Hold Student QR Code up to Camera</h2>
        
        <div id="reader" class="mx-auto bg-white rounded shadow-lg overflow-hidden" style="width: 350px; max-width: 100%; min-height: 250px; color: #333;"></div>
        
        <div id="status-msg" class="mt-3 text-warning">Starting camera...</div>

        <br>
        <a href="/" class="btn btn-outline-light btn-md mt-2">⬅️ Return to Dashboard</a>
    </div>

    <script>
      let html5QrCode;

      function onScanSuccess(studentId) {
        // Pause camera temporarily after a successful read
        if (html5QrCode) {
            html5QrCode.pause();
        }

        fetch('/mark-attendance/', {
          method: 'POST',
          headers: {
              'Content-Type': 'application/json',
              'X-CSRFToken': '{{ csrf_token }}'
          },
          body: JSON.stringify({ student_id: studentId })
        })
        .then(response => response.json())
        .then(data => {
            alert(data.message);
            // Resume scanning after alert is dismissed
            if (html5QrCode) {
                html5QrCode.resume();
            }
        })
        .catch(err => {
            console.error("Error processing scan: ", err);
            if (html5QrCode) {
                html5QrCode.resume();
            }
        });
      }

      function startCamera() {
          const config = { fps: 10, qrbox: { width: 250, height: 250 } };

          // Try forcing the back camera strictly first (for mobile devices)
          html5QrCode.start(
              { facingMode: { exact: "environment" } }, 
              config, 
              onScanSuccess
          ).then(() => {
              updateStatus("Camera active. Place QR code in front of lens.", "text-success");
          }).catch(err => {
              // Fallback for desktop webcams or devices that don't support 'exact'
              html5QrCode.start(
                  { facingMode: "environment" }, 
                  config, 
                  onScanSuccess
              ).then(() => {
                  updateStatus("Camera active. Place QR code in front of lens.", "text-success");
              }).catch(fallbackErr => {
                  console.error("Camera access error: ", fallbackErr);
                  updateStatus("Unable to access rear camera. Please allow camera permissions.", "text-danger");
              });
          });
      }

      function updateStatus(message, textClass) {
          const statusDiv = document.getElementById("status-msg");
          statusDiv.innerText = message;
          statusDiv.className = "mt-3 " + textClass;
      }

      document.addEventListener("DOMContentLoaded", function () {
          html5QrCode = new Html5Qrcode("reader");
          startCamera();
      });
    </script>
</body>
</html>
